version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: resume_builder_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jms2775  # 원하는 비밀번호로 변경하셔도 좋습니다
      POSTGRES_DB: resume_builder
    volumes:
      - ./postgres-data:/var/lib/postgresql/data