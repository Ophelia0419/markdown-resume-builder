spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resume_builder}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect